<!DOCTYPE html>
<html lang="es">
<header>

<body class="contenedor">
    <p>Adopta Gatitos</p>
    <p>Este es un plataforma para adoptar gatitos Bv</p>

    <p>Kakakakakaka</p>
    <div id="navbarContainer"></div>
    <div id="mainContainer">
        <h3>registrar Usuario</h3>
        <form id="registroUsuarioForm" method="get">
            <ul>
                <li>
                    <label> NOMBRE: </label>
                    <input type="text" name="nombre" required />
                </li>
                <li>
                    <label> USERNAME: </label>
                    <input type="text" name="username" required />
                </li>
                <li>
                    <label> EMAIL: </label>
                    <input type="email" name="email" required />
                </li>
                <li>
                    <label> PASSWORD: </label>
                    <input type="password" name="password" required />
                </li>
                <li>
                    <label> TELEFONO: </label>
                    <input type="tel" name="telefono" required />
                </li>
                <li>
                    <label> GENERO: </label>
                    <input type="text" name="genero" required />
                </li>
                <li>
                    <label> FOTO PERFIL: </label>
                    <input type="text" name="foto_perfil" />
                </li>
            </ul>
            <button type="submit">registrar</button>
        </form>
        <h3>registrar Encargado</h3>
        <form id="registroEncargadoForm" method="get">
            <!-- nombre=EncargadoTest&username=enca21&email=encargado@gmail.com&password=Kazo&telefono=0123456789&foto_perfil=FotoBV&id_refugio=2
 -->
            <ul>
                <li>
                    <label> NOMBRE: </label>
                    <input type="text" name="nombre" required />
                </li>
                <li>
                    <label> USERNAME: </label>
                    <input type="text" name="username" required />
                </li>
                <li>
                    <label> EMAIL: </label>
                    <input type="email" name="email" required />
                </li>
                <li>
                    <label> PASSWORD: </label>
                    <input type="password" name="password" required />
                </li>
                <li>
                    <label> TELEFONO: </label>
                    <input type="tel" name="telefono" required />
                </li>

                <li>
                    <label> FOTO PERFIL: </label>
                    <input type="text" name="foto_perfil" />
                </li>
                <li>
                    <label> REFUGIO: </label>
                    <input type="text" name="id_refugio" />
                </li>
            </ul>
            <button type="submit">registrar</button>
        </form>
    </div>
    <script>
        document
            .getElementById("registroUsuarioForm")
            .addEventListener("submit", async function (event) {
                event.preventDefault(); // Evita que la página se recargue

                const formData = new FormData(this);
                const params = new URLSearchParams(formData).toString(); // Convierte los datos a formato URL
                const url = `https://kuramadev.com/adopta_gatitos/Php/registrar_usuario.php?${params}`;

                //console.log("URL generada:", url); // Verifica que la URL sea correcta

                try {
                    const response = await fetch(url, { method: "GET", mode: "cors" });

                    const text = await response.text();

                    const result = JSON.parse(text); // Parsea manualmente para evitar errores
                    alert(result.success || result.error); // Muestra respuesta del servidor
                } catch (error) {
                    console.error("Error al enviar el formulario", error);
                    alert("Hubo un error al enviar los datos");
                }
            });
    </script>

    <script>
        document
            .getElementById("registroEncargadoForm")
            .addEventListener("submit", async function (event) {
                event.preventDefault(); // Evita que la página se recargue

                const formData = new FormData(this);
                const params = new URLSearchParams(formData).toString(); // Convierte los datos a formato URL
                const url = `https://kuramadev.com/adopta_gatitos/Php/api/encargado/registrar_encargado.php?${params}`;

                console.log("URL generada:", url); // Verifica que la URL sea correcta

                try {
                    const response = await fetch(url, { method: "GET", mode: "cors" });

                    const text = await response.text();

                    const result = JSON.parse(text); // Parsea manualmente para evitar errores
                    // Manejamos los tres posibles tipos de respuesta
                    if (result.Success) {
                        alert(result.Success);
                    } else if (result.Warning) {
                        alert("Advertencia: " + result.Warning);
                    } else if (result.Error) {
                        alert("Error: " + result.Error);
                    } else {
                        alert("Respuesta desconocida del servidor.");
                    }
                } catch (error) {
                    console.error("Error al enviar el formulario", error);
                    alert("Hubo un error al enviar los datos");
                }
            });
    </script>

    <script src="/Js/authenticatedUser.js"></script>

    </div>
