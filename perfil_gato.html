<!DOCTYPE html>
<html lang="es">
<header>
    <title>Adopta Gatitos</title>
    <link rel="stylesheet" href="Css/styles.css" />
    <link rel="stylesheet" href="Css/normalize.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;700&family=Staatliches&display=swap"
        rel="stylesheet" />
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    /> -->
</header>

<body>

    <div id="navbarContainer"></div>
    <main>


        <!--   <pre id="datosContainer" class="dataContainer"></pre> -->
        <div id="detalleGato"></div>

        <div id="btnAdoptar"></div>

        <script type="module">
            import { perfil_mascota } from '/Js/urlConfig.js';
            document.addEventListener("DOMContentLoaded", async function () {
                const params = new URLSearchParams(window.location.search);
                const id_gato = params.get("id_mascota"); // Obtiene el ID de la URL
                console.log(`id_gato recibido => ${id_gato}`);
                if (id_gato) {
                    try {
                        const response = await fetch(`${perfil_mascota}?id_mascota=${id_gato}`);
                        const data = await response.json();
                        console.log(data);
                        document.getElementById("detalleGato").innerHTML = /*html*/ `
          <h2>${data.nombre}</h2>
          <img src="${data.foto}" class="gato-item-foto">
          <p><strong>Género: </strong>${data.genero}</p>
          <p><strong>Edad: </strong>${data.edad}</p>
          <p><strong>Descripción: </strong>${data.descripcion}</p>
          <p><strong>Estado: </strong>${data.estado}</p>
          <p><strong>Fecha de ingreso: </strong>${data.fecha_ingreso}</p>
          <p><strong>Color: </strong>${data.color}</p>
          <p><strong>Fecha de adopcion: </strong>${data.fecha_adopcion}</p>
          <p><strong>Personalidad: </strong>${data.id_personalidad}</p>
          <p><strong>Raza: </strong>${data.id_raza}</p>
          <p><strong>Refugio: </strong>${data.id_refugio}</p>

        `;
                    } catch (error) {
                        console.error("Error al obtener datos:", error);
                    }
                } else {
                    document.getElementById("detalleGato").innerHTML = "<p>Error: No se encontró el gato.</p>";
                }
            });
        </script>
        <script src="Js/navbarScript.js"></script>
        <script src="Js/authenticatedUser.js"></script>
        <script type="module">
            import { Auth } from './Js/Auth.js';
            document.addEventListener("DOMContentLoaded", function async() {
                const boolUser = Auth.isUserLoggedIn();

                if (boolUser) {
                    document.getElementById("btnAdoptar").innerHTML = `
                <button id="adoptar" type="button">Adoptar</button> 
                `;

                    document.getElementById("btnAdoptar").addEventListener("click", () => {
                        //localStorage.removeItem("authenticated user");
                        window.location.href = "index.html";
                        //window.location.reload();
                        //console.log("SESION CERRADA Bv");
                    });
                }
            })
        </script>
        <script src="Js/footerScript.js"></script>

    </main>
    <div id="footerContainer"></div>
</body>


</html>
