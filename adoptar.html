<!DOCTYPE html>
<html lang="es">
<header>
  <title>Adopta Gatitos</title>
  <link rel="stylesheet" href="Css/styles.css" />
  <link rel="stylesheet" href="Css/normalize.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;700&family=Staatliches&display=swap"
    rel="stylesheet" />
  <!-- <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    /> -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css" crossorigin="anonymous">




</header>

<body class="contenedor">
  <p>Adopta Gatitos</p>
  <p>Este es un plataforma para adoptar gatitos Bv</p>

  <ion-icon name="person"></ion-icon>

  <div id="navbarContainer"></div>

  <h3>registrar</h3>

  <!--   <pre id="datosContainer" class="dataContainer"></pre> -->
  <div id="datosContainer"></div>


  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      try {
        const response = await fetch(
          "https://kuramadev.com/adopta_gatitos/Php/api/gato/mostrar_gatos.php"
        );
        const data = await response.json(); // Convertir la respuesta a JSON

        console.log("Datos recibidos:", data); // Para ver qué llega en la consola

        // Ejemplo: Mostrar los datos en la página
        const contenedor = document.getElementById("datosContainer");
        //contenedor.innerHTML = JSON.stringify(data, null, 2); // Mostrar JSON en pantalla

        data.forEach((gato) => {
          const item = document.createElement("div");
          item.classList.add("gato-item");

          // Determinar el icono según el género
          const icono = gato.genero.toLowerCase() === "macho" ? "fas fa-mars" : "fas fa-venus";
          const color = gato.genero.toLowerCase() === "macho" ? "color: blue;" : "color: pink;";

          item.innerHTML = `
          <div class='gato-item-container'>
            <img class='gato-item-foto' src="${gato.foto}"> 
            <h3>${gato.nombre} </h3>
            <p class='gato-item-text'><strong>Género: </strong>${gato.genero} <i class="${icono}" style="${color}"></i></p>

            <p class='gato-item-text'><strong>Edad: </strong>${gato.edad}</p>
         
            <button onclick="PerfilGato(${gato.id_gato})">Ver perfil</button>
            </div>

            `;

          contenedor.appendChild(item);
        });
      } catch (error) {
        console.error("Error al obtener datos:", error);
      }
    });

    function PerfilGato(id_gato) {
      //window.location.href=`perfil_gato.html?id_gato=${id_gato}`;
      window.location.href = `perfil_gato.html?id_gato=${id_gato}`;
    }
  </script>
  <script src="Js/navbarScript.js"></script>
  <script src="Js/footerScript.js"></script>


</body>
<div id="footerContainer"></div>


</html>
