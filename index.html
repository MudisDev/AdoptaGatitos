<body class="contenedor">
  <p>Adopta Gatitos</p>

  <p>Kakakakakaka</p>
  <div id="navbarContainer"></div>
  <div id="mainContainer">
    
  </div>
  <script>
    document
      .getElementById("registroForm")
      .addEventListener("submit", async function (event) {
        event.preventDefault(); // Evita que la página se recargue

        const formData = new FormData(this);
        const params = new URLSearchParams(formData).toString(); // Convierte los datos a formato URL
        const url = `https://kuramadev.com/adopta_gatitos/Php/registrar_usuario.php?${params}`;

        //console.log("URL generada:", url); // Verifica que la URL sea correcta

        try {
          const response = await fetch(url, { method: "GET", mode: "cors" });

          const text = await response.text();

          const result = JSON.parse(text); // Parsea manualmente para evitar errores
          alert(result.success || result.error); // Muestra respuesta del servidor
        } catch (error) {
          console.error("Error al enviar el formulario", error);
          alert("Hubo un error al enviar los datos");
        }
      });
  </script>
  <script src="Js/navbarScript.js"></script>
