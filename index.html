<html lang="es">

      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"

</header>

<body class="contenedor">

  <div id="navbarContainer"></div>
  <div id="mainContainer">



    <div id="loginForm"></div>


    <div id="closeSession"></div>


  </div>

  <!-- <script > -->
  <script type="module">
    import { ciudadano_iniciar_sesion } from './Js/urlConfig.js';
    import { authenticatedUser } from './Js/authenticatedUser.js';
    document.addEventListener("DOMContentLoaded", async function () {
      //const params = new URLSearchParams(window.location.search);
      /* const id_gato = params.get("id_gato"); // Obtiene el ID de la URL
      console.log(`id_gato recibido => ${id_gato}`); */
      //import {ciudadano} from "Js/urlConfig.js";

      const boolUser = authenticatedUser();



      if (boolUser) {
        document.getElementById("closeSession").innerHTML = '<h3>true</h3>  <button id="logoutBtn" type="button">Cerrar sesion</button>   ';

        //document.getElementById("iniciarSesionUsuarioForm").style.display = "block";

        document.getElementById("logoutBtn").addEventListener("click", () => {
          localStorage.removeItem("authenticated user");
          //window.location.href = "login.html";
          window.location.reload();
          console.log("SESION CERRADA Bv");
        });
      }
      else {
        document.getElementById("closeSession").innerHTML = `<h4>FALSE</h4>   
         `;
        //document.getElementById("iniciarSesionUsuarioForm").style.display = "none";
      }

      if (!boolUser) {
        document.getElementById("loginForm").innerHTML = `
<form id="iniciarSesionUsuarioForm" method="get">
      <!-- nombre=EncargadoTest&username=enca21&email=encargado@gmail.com&password=Kazo&telefono=0123456789&foto_perfil=FotoBV&id_refugio=2
 -->
      <ul>

        <li>
          <label> USERNAME: </label>
          <input type="text" name="username" required />
        </li>

        <li>
          <label> PASSWORD: </label>
          <input type="password" name="password" required />
        </li>

      </ul>
      <button type="submit">Iniciar sesion</button>
    </form>

`;

        // ✅ Ahora que ya existe, puedes agregarle el evento:
        document
          .getElementById("iniciarSesionUsuarioForm")
          .addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = new FormData(this);
            const params = new URLSearchParams(formData).toString();
            //const url = `${ciudadano_iniciar_sesion}?${params}`;
            const url = `https://kuramadev.com/adopta_gatitos/Php/api/ciudadano/iniciar_sesion.php?${params}`;

            try {
              const response = await fetch(url, { method: "GET", mode: "cors" });
              const text = await response.text();
              const result = JSON.parse(text);

              if (result.Error) {
                alert("Error: " + result.Error);
              } else {
                localStorage.setItem("authenticated user", JSON.stringify(result));
                window.location.reload();
              }
            } catch (error) {
              console.error("Error al enviar el formulario", error);
              alert("Hubo un error al enviar los datos");
            }
          });

      }

    });
  </script>

  <script src="Js/navbarScript.js"></script>
  <script src="Js/footerScript.js"></script>

  </div>
</body>
