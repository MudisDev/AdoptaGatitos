  <body class="contenedor">
    <p>Adopta Gatitos</p>
    <p>Este es un plataforma para adoptar gatitos Bv</p>
    <nav class="navbar">
      <a class="navbar__url" href="">Inicio</a>
      <a class="navbar__url" href="">Nosotros</a>
      <a class="navbar__url" href="">Adoptar</a>
      <a class="navbar__url" href="">Iniciar Sesion</a>
      <a class="navbar__url" href="">Contacto</a>
    </nav>

    <p>Kakakakakaka</p>
    <h3>registrar</h3>
    <form id="registroForm" method="get">
      <ul>
        <li>
          <label> NOMBRE: </label>
          <input type="text" name="nombre" required />
        </li>
        <li>
          <label> USERNAME: </label>
          <input type="text" name="username" required />
        </li>
        <li>
          <label> EMAIL: </label>
          <input type="email" name="email" required />
        </li>
        <li>
          <label> PASSWORD: </label>
          <input type="password" name="password" required />
        </li>
        <li>
          <label> TELEFONO: </label>
          <input type="tel" name="telefono" required />
        </li>
        <li>
          <label> GENERO: </label>
          <input type="text" name="genero" required />
        </li>
        <li>
          <label> FOTO PERFIL: </label>
          <input type="text" name="foto_perfil" />
        </li>
      </ul>
      <button type="submit">registrar</button>
    </form>

    <script>
      document
        .getElementById("registroForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault(); // Evita que la página se recargue

          const formData = new FormData(this);
          const params = new URLSearchParams(formData).toString(); // Convierte los datos a formato URL

          try {
            const response = await fetch(
              `https://kuramadev.com/adopta_gatitos/Php/registrar_usuario.php?${params}`,
              {
                method: "GET",
                mode: "cors",
              }
            );

            const text = await response.text();
            console.log("Respuesta del servidor:", text);

            const result = await response.json();
            
            alert(result.success || result.error); // Muestra respuesta del servidor
          } catch (error) {
            console.error("Error al enviar el formulario", error);
            alert("Hubo un error al enviar los datos");
          }
        });
    </script>
  </body>
